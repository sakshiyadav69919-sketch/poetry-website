<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="admin-section">

        <div class="admin-box">

            <p class="eyebrow">
                PRIVATE AREA
            </p>

            <h1>Welcome back ✦</h1>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button onclick="login()">
                Login
            </button>

            <p id="message"></p>

        </div>

    </section>

    <script src="login.js"></script>

</body>

</html>
